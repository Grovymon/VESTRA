name: Windows x64

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVESTRA_ENABLE_LIBREOFFICE=OFF
          -DVESTRA_ENABLE_PDFIUM=OFF
          -DVESTRA_ENABLE_QT_PDF=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy worker runtime for IPC integration test
        run: |
          windeployqt --no-translations build/bin/vestra-document-worker.exe
          windeployqt --no-translations build/bin/vestra-pdf.exe

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Verify formatting
        shell: pwsh
        run: |
          $files = git ls-files '*.cpp' '*.h'
          clang-format --dry-run --Werror $files

      - name: Package portable Beta build
        shell: pwsh
        run: |
          $stage = 'dist/Vestra-0.1.0-beta-win64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $executables = @(
            'vestra.exe',
            'vestra-writer.exe',
            'vestra-sheets.exe',
            'vestra-slides.exe',
            'vestra-pdf.exe',
            'vestra-document-worker.exe'
          )
          foreach ($executable in $executables) {
            Copy-Item "build/bin/$executable" "$stage/$executable"
          }
          Copy-Item README.md, LICENSE, THIRD_PARTY_LICENSES.md $stage
          Copy-Item docs/README_RU.md "$stage/README_RU.md"
          windeployqt --release --compiler-runtime --no-translations --dir $stage `
            "$stage/vestra.exe" `
            "$stage/vestra-writer.exe" `
            "$stage/vestra-sheets.exe" `
            "$stage/vestra-slides.exe" `
            "$stage/vestra-pdf.exe" `
            "$stage/vestra-document-worker.exe"
          Compress-Archive -Path $stage -DestinationPath 'dist/Vestra-0.1.0-beta-win64.zip'

      - name: Upload portable Beta archive
        uses: actions/upload-artifact@v4
        with:
          name: Vestra-0.1.0-beta-win64
          path: dist/Vestra-0.1.0-beta-win64.zip
          if-no-files-found: error

